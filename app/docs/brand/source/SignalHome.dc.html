<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skyfare home, Signal identity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&amp;family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC72C}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="background: #111111; color: #F4F4EF; font-family: 'Public Sans', sans-serif; min-height: 1180px">

<header style="max-width: 1280px; margin: 0 auto; padding: 24px 32px; display: flex; align-items: center; justify-content: space-between">
<a href="#" style="display: flex; align-items: stretch; text-decoration: none">
<svg width="44" height="44" viewBox="0 0 64 64" fill="none" aria-hidden="true"><rect width="64" height="64" fill="#FFC72C"/><path d="M19 45 L44 20 M25 20 H44 V39" stroke="#111111" stroke-width="7" stroke-linecap="square"/></svg>
<span style="background: #F4F4EF; color: #111111; display: flex; align-items: center; padding: 0 14px; font-family: Archivo, sans-serif; font-stretch: 72%; font-size: 30px; font-weight: 900; text-transform: uppercase">Skyfare</span>
</a>
<nav style="display: flex; align-items: center; gap: 4px; font-family: Archivo, sans-serif; font-stretch: 85%; font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: 0.04em">
<a href="#" style="padding: 12px 16px; background: #FFC72C; color: #111111; text-decoration: none">Flights</a>
<a href="#" style="padding: 12px 16px; color: #C9C9C2; text-decoration: none">How we score</a>
<a href="#" style="padding: 12px 16px; color: #C9C9C2; text-decoration: none">Africa (soon)</a>
<button type="button" aria-label="Switch to light mode" style="margin-left: 8px; width: 44px; height: 44px; border: 2px solid #3A3A36; background: transparent; color: #F4F4EF; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
</nav>
</header>

<section style="max-width: 1280px; margin: 0 auto; padding: 72px 32px 64px; display: flex; flex-direction: column; align-items: center; text-align: center">
<div style="display: flex; gap: 4px">
<sc-for list="{{flapHero}}" as="c" hint-placeholder-count="9">
<div style="width: 40px; height: 56px; border-radius: 3px; background: linear-gradient(#262626 49%, #000000 49%, #000000 52%, #1E1E1E 52%); color: #FFC72C; font-family: Archivo, sans-serif; font-stretch: 85%; font-weight: 800; font-size: 34px; display: flex; align-items: center; justify-content: center">{{c.ch}}</div>
</sc-for>
</div>
<h1 style="margin: 28px 0 0; font-family: Archivo, sans-serif; font-stretch: 68%; font-size: 168px; font-weight: 900; line-height: 0.85; text-transform: uppercase; color: #FFC72C">Skyfare</h1>
<p style="margin: 22px 0 0; max-width: 640px; font-size: 21px; line-height: 1.5; color: #C9C9C2">Every flight across Nigeria on one board. Compared on price, time and how often it actually leaves on time.</p>

<form style="width: 100%; margin-top: 44px; text-align: left">
<div style="display: flex; gap: 4px; margin-bottom: 8px; font-family: Archivo, sans-serif; font-stretch: 85%; font-weight: 800; font-size: 15px; text-transform: uppercase">
<button type="button" style="min-height: 40px; padding: 0 18px; border: none; background: #F4F4EF; color: #111111; font: inherit">One way</button>
<button type="button" style="min-height: 40px; padding: 0 18px; border: 2px solid #3A3A36; background: transparent; color: #C9C9C2; font: inherit">Return</button>
</div>
<div style="display: flex; align-items: stretch; border: 4px solid #FFC72C; background: #1C1C1C">
<label style="flex: 1.2; padding: 14px 20px; border-right: 2px solid #3A3A36"><span style="display: block; font-family: Archivo, sans-serif; font-stretch: 85%; font-weight: 800; font-size: 13px; letter-spacing: 0.1em; color: #FFC72C">FROM</span><input value="LAGOS (LOS)" style="width: 100%; margin-top: 4px; background: transparent; border: none; color: #F4F4EF; font: 900 26px Archivo, sans-serif; font-stretch: 75%; outline: none"></label>
<label style="flex: 1.2; padding: 14px 20px; border-right: 2px solid #3A3A36"><span style="display: block; font-family: Archivo, sans-serif; font-stretch: 85%; font-weight: 800; font-size: 13px; letter-spacing: 0.1em; color: #FFC72C">TO</span><input value="ABUJA (ABV)" style="width: 100%; margin-top: 4px; background: transparent; border: none; color: #F4F4EF; font: 900 26px Archivo, sans-serif; font-stretch: 75%; outline: none"></label>
<label style="flex: 1; padding: 14px 20px; border-right: 2px solid #3A3A36"><span style="display: block; font-family: Archivo, sans-serif; font-stretch: 85%; font-weight: 800; font-size: 13px; letter-spacing: 0.1em; color: #FFC72C">DATE</span><input value="THU 08 OCT" style="width: 100%; margin-top: 4px; background: transparent; border: none; color: #F4F4EF; font: 900 26px Archivo, sans-serif; font-stretch: 75%; outline: none"></label>
<label style="flex: 1; padding: 14px 20px"><span style="display: block; font-family: Archivo, sans-serif; font-stretch: 85%; font-weight: 800; font-size: 13px; letter-spacing: 0.1em; color: #FFC72C">PASSENGERS · CABIN</span><input value="1 ADULT · ECO" style="width: 100%; margin-top: 4px; background: transparent; border: none; color: #F4F4EF; font: 900 26px Archivo, sans-serif; font-stretch: 75%; outline: none"></label>
<button type="submit" style="display: flex; align-items: center; gap: 10px; padding: 0 32px; border: none; background: #FFC72C; color: #111111; font: 900 28px Archivo, sans-serif; font-stretch: 72%; text-transform: uppercase">Search<svg width="26" height="26" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M19 45 L44 20 M25 20 H44 V39" stroke="#111111" stroke-width="8" stroke-linecap="square"/></svg></button>
</div>
</form>
</section>

<section style="max-width: 1280px; margin: 0 auto; padding: 0 32px 48px">
<div style="background: #050505; padding: 24px 28px; display: flex; flex-direction: column; gap: 8px">
<div style="display: grid; grid-template-columns: 1fr 1fr 220px; gap: 16px; padding: 0 12px 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #8A8A85"><span>POPULAR DEPARTURES</span><span>ROUTE</span><span style="text-align: right">ACTION</span></div>
<sc-for list="{{routes}}" as="r" hint-placeholder-count="5">
<a href="#" style="display: grid; grid-template-columns: 1fr 1fr 220px; gap: 16px; align-items: center; padding: 12px; background: #141414; text-decoration: none; color: #F4F4EF">
<span style="display: flex; gap: 3px">
<sc-for list="{{r.flaps}}" as="c" hint-placeholder-count="7">
<span style="width: 26px; height: 38px; border-radius: 3px; background: linear-gradient(#262626 49%, #000000 49%, #000000 52%, #1E1E1E 52%); font-family: Archivo, sans-serif; font-stretch: 85%; font-weight: 800; font-size: 22px; display: flex; align-items: center; justify-content: center">{{c.ch}}</span>
</sc-for>
</span>
<span style="font-family: Archivo, sans-serif; font-stretch: 80%; font-weight: 800; font-size: 22px; text-transform: uppercase">{{r.name}}</span>
<span style="justify-self: end; padding: 8px 14px; background: #FFC72C; color: #111111; font-family: Archivo, sans-serif; font-stretch: 80%; font-weight: 900; font-size: 18px">COMPARE ↗</span>
</a>
</sc-for>
</div>
</section>

<section style="max-width: 1280px; margin: 0 auto; padding: 0 32px 96px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{props}}" as="p" hint-placeholder-count="3">
<div style="{{p.style}}">
<div style="font-family: Archivo, sans-serif; font-stretch: 72%; font-weight: 900; font-size: 40px; line-height: 0.95; text-transform: uppercase">{{p.title}}</div>
<div style="font-size: 16px; line-height: 1.6">{{p.body}}</div>
</div>
</sc-for>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
renderVals() {
const split = (s) => s.split('').map((ch) => ({ ch: ch === ' ' ? ' ' : ch }));
const tile = 'padding: 28px; display: flex; flex-direction: column; gap: 12px; ';
return {
flapHero: split('LOS → ABV'),
routes: [['LOS ABV', 'Lagos → Abuja'], ['LOS PHC', 'Lagos → Port Harcourt'], ['ABV PHC', 'Abuja → Port Harcourt'], ['LOS KAN', 'Lagos → Kano'], ['LOS ENU', 'Lagos → Enugu']].map(([codes, name]) => ({ flaps: split(codes), name })),
props: [
{ title: 'Every flight. One board.', body: 'All Nigerian airlines on your route. If we can’t price a flight, it still shows.', style: tile + 'background: #FFC72C; color: #111111;' },
{ title: 'Reliable. Mixed. Often late.', body: 'Each flight scored 1–10 from its airline’s delays and cancellations on your route over 60 days.', style: tile + 'background: #0B8F8F; color: #FFFFFF;' },
{ title: 'Our pick, lit up.', body: 'One recommendation balancing price, time and reliability, with the reason in one line.', style: tile + 'background: #F4F4EF; color: #111111;' }
]
};
}
}
</script>
</body>
</html>
